[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-predict"
version = "0.1.0"
description = "Production-grade UFC fight prediction system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.2",
    "xgboost>=2.0",
    "torch>=2.1",
    "shap>=0.44",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "tqdm>=4.66",
    "click>=8.1",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "scipy>=1.12",
    "tenacity>=8.2",
    "fake-useragent>=1.4",
]

[project.scripts]
ufc-predict = "ufc_predict.cli:cli"

[tool.setuptools.packages.find]
include = ["ufc_predict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
